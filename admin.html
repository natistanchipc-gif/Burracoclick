<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Amministratore BurracoClick</title>

<style>

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#0b6b3a;
}

.container{
    max-width:500px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,0,0,.3);
}

h1{
    color:#0b6b3a;
}

h2{
    color:#444;
}

button{
    width:100%;
    padding:18px;
    font-size:22px;
    margin:15px 0;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.apri{
    background:#28a745;
    color:white;
}

.chiudi{
    background:#dc3545;
    color:white;
}

</style>

</head>

<body>

<div class="container">

<h1>🔒 AREA AMMINISTRATORE</h1>

<h2>🎲 BurracoClick</h2>

<button class="apri" onclick="apriIscrizioni()">
🟢 APRI ISCRIZIONI
</button>

<button class="chiudi" onclick="chiudiIscrizioni()">
🔴 CHIUDI ISCRIZIONI
</button>

</div>

<script>

// ===============================
// PIN AMMINISTRATORE
// ===============================

const PIN = "2580";

let pin = prompt("🔒 Inserisci il PIN Amministratore");

if(pin !== PIN){

    alert("PIN non corretto!");

    document.body.innerHTML = `
    <div style="text-align:center;padding:80px;font-family:Arial;">
        <h1>⛔ ACCESSO NEGATO</h1>
        <h2>PIN ERRATO</h2>
    </div>
    `;

    throw new Error("Accesso negato");
}

// ===============================
// APRI ISCRIZIONI
// ===============================

function apriIscrizioni(){

    localStorage.setItem("iscrizioni","aperte");

    let testo =
"🎲 CLUB INTERNAZIONALE DEI NATI STANCHI\n\n"+
"Sono aperte le iscrizioni al Torneo di Burraco.\n\n"+
"Per iscriverti clicca sul link:\n\n"+
"https://natistanchipc-gif.github.io/Burracoclick/\n\n"+
"Vi aspettiamo!";

    window.open(
        "https://wa.me/?text="+encodeURIComponent(testo),
        "_blank"
    );

    alert("✅ Iscrizioni aperte");

}

// ===============================
// CHIUDI ISCRIZIONI
// ===============================

function chiudiIscrizioni(){

    localStorage.setItem("iscrizioni","chiuse");

    alert("⛔ Iscrizioni chiuse.");

}

</script>

</body>

</html>
